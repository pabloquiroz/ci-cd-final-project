name: CI workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4        # ← v3 to v4
      - name: Setup Node.js
        uses: actions/setup-node@v4      # ← v3 to v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Run unit tests with Jest
        run: npm test
